<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Payment Settings - EDVO Admin</title>
  <link rel="stylesheet" href="/backend/admin/styles.css" />
  <style>
    .stack { display: grid; gap: 20px; }
    .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 8px 30px rgba(15,23,42,.06); padding: 24px; }
    .toolbar { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .input, .select { width: 100%; min-height: 46px; padding: 12px 16px; border: 1px solid #cbd5e0; border-radius: 12px; background: #fff; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .btn { border: none; border-radius: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
    .btn-primary { background: #667eea; color: #fff; }
    .btn-secondary { background: #edf2f7; color: #1a202c; }
    .help { color: #718096; font-size: .88rem; }
    .summary-card { border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px 18px; background: #f8fafc; }
    .summary-label { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: #64748b; font-weight: 700; }
    .summary-value { display: block; margin-top: 6px; font-size: 1rem; font-weight: 700; color: #0f172a; }
  </style>
</head>
<body>
  <aside class="sidebar"></aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="page-title">Course Payment Settings</div>
      <div class="user-avatar">A</div>
    </header>

    <div class="dashboard-content">
      <div class="stack">
        <section class="panel">
          <div class="toolbar">
            <div>
              <div class="table-title">Checkout Configuration</div>
              <div class="help">Manage Razorpay and fallback payment settings used across frontend registrations and checkout.</div>
            </div>
            <div class="actions">
              <a class="btn btn-secondary" href="/backend/admin/courses">Back to Courses</a>
            </div>
          </div>

          <div class="grid" style="margin-bottom:16px">
            <div class="summary-card">
              <span class="summary-label">Gateway Status</span>
              <span class="summary-value" id="paymentStatusLabel">Loading...</span>
            </div>
            <div class="summary-card">
              <span class="summary-label">Mode</span>
              <span class="summary-value" id="paymentModeLabel">Loading...</span>
            </div>
            <div class="summary-card">
              <span class="summary-label">Currency</span>
              <span class="summary-value" id="paymentCurrencyLabel">Loading...</span>
            </div>
          </div>

          <form id="payForm" class="stack">
            <div class="grid">
              <select id="payActive" class="select">
                <option value="true">Active</option>
                <option value="false">Disabled</option>
              </select>
              <select id="payMode" class="select">
                <option value="true">Test</option>
                <option value="false">Live</option>
              </select>
              <input id="payKeyId" class="input" placeholder="Razorpay key ID" />
              <input id="payKeySecret" class="input" placeholder="Razorpay key secret" />
              <input id="payCurrency" class="input" placeholder="INR" />
              <input id="payTheme" class="input" placeholder="#c17017" />
              <input id="payCompany" class="input" placeholder="EDVO" />
              <input id="paySupport" class="input" placeholder="support@edvo.com" />
            </div>
            <div class="actions">
              <button class="btn btn-primary" type="submit">Save Payment Settings</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script src="/backend/admin/admin.js?v=20260416c"></script>
  <script src="/backend/admin/course-payment-settings-admin.js?v=20260425a"></script>
</body>
</html>
